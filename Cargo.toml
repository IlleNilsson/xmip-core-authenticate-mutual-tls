[package]
name = "xmip-core-authenticate-mutual-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-mutual-tls"
description = "Authenticate by mutual-tls: verifies the client certificate the TLS handshake proved, bound to the connection."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The gate's own trait, with its x509 module turned on for the names an
# issuer allow-list compares (ADR-0044).
# context for Verified, xcore for the mechanism.
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main", features = ["x509"] }
# identify for the names a claim carries across the gates (identify::evidence),
# declared once for the first gate that writes them and this one that reads.
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[dev-dependencies]
# The tests mint their own chains; `mint` ships in no build.
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main", features = ["mint"] }

[lints]
workspace = true
